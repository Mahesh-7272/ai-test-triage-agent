[pytest]
# "pythonpath = ." lets tests do: from pages.login_page import LoginPage
pythonpath = .
testpaths = tests
# --base-url lets page objects use page.goto("/")
# screenshot / tracing / video are saved only when a test fails, for the AI analyzer later
addopts =
    --base-url https://www.saucedemo.com
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output reports/artifacts
    --html=reports/report.html --self-contained-html
    --junitxml=reports/results.xml
markers =
    smoke: quick checks of the main flow
    demo_failure: tests that fail on purpose (problem_user bugs), used to practise failure analysis
